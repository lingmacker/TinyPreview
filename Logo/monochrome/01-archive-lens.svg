    </linearGradient>
    <clipPath id="icon-shape"><rect width="100" height="100" rx="19.53125"/></clipPath>
    <filter id="lift" x="-35%" y="-30%" width="180%" height="185%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.52"/></filter>
