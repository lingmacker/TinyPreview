<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" color="#F7F7F5" role="img" aria-labelledby="title desc">
  <title id="title">TinyPreview — Archive Lens</title>
  <desc id="desc">A magnifying glass inspects a file emerging from an archive.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="5" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303030"/><stop offset="0.48" stop-color="#171717"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(26 13) rotate(48) scale(70)">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="23" y1="16" x2="66" y2="74" gradientUnits="userSpaceOnUse">
