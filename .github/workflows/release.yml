name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $TAG_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from Git
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Changes"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty='- %s (`%h`)' "$previous_tag..$TAG_NAME"
              echo
              echo "**Full Changelog**: https://github.com/$REPOSITORY/compare/$previous_tag...$TAG_NAME"
            else
              git log --no-merges --pretty='- %s (`%h`)' "$TAG_NAME"
            fi
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Build release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DERIVED_DATA: ${{ runner.temp }}/TinyPreviewDerivedData
        run: |
          make build \
            CONFIGURATION=Release \
            DERIVED_DATA="$DERIVED_DATA" \
            DESTINATION="platform=macOS,arch=arm64" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Verify release app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DERIVED_DATA: ${{ runner.temp }}/TinyPreviewDerivedData
        run: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/Release/TinyPreview.app"
          test -d "$app"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$actual_version" != "$VERSION" ]]; then
            echo "Expected version $VERSION, found $actual_version" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package release assets
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DERIVED_DATA: ${{ runner.temp }}/TinyPreviewDerivedData
          DIST_DIR: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/Release/TinyPreview.app"
          dmg="TinyPreview-$VERSION-macos-arm64.dmg"
          dmg_root="$RUNNER_TEMP/dmg-root"
          mkdir -p "$DIST_DIR" "$dmg_root"
          ditto "$app" "$dmg_root/TinyPreview.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname TinyPreview \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$DIST_DIR/$dmg"
          cd "$DIST_DIR"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          echo "archive=$DIST_DIR/$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$DIST_DIR/$dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyPreview-${{ steps.version.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
          RELEASE_NOTES: ${{ steps.notes.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TinyPreview $VERSION" \
            --notes-file "$RELEASE_NOTES"
